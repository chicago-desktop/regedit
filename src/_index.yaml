version: "1.0"
namespace: chicago.regedit

# A registry viewer in the look of Windows 95 regedit: a tree of namespaces
# and entries, the entry's fields, the path in the status bar. Read-only. The
# window is built on the shell SDK: the tree, table, menu and status bar are
# shared; the only thing of its own here is the tree model.
#
# Keep the comments of this file free of an unquoted `: ` — a colon followed
# by a space inside a meta.comment or a YAML comment value breaks the parse
# of the whole index, and the boot with it. Quote such comments.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Registry Editor
      description: "The Registry Editor for the Chicago desktop — a read-only viewer of the runtime's registry, for administrators."

  # ─── Dependencies ────────────────────────────────────────────────────
  # The shell and the base are resolved from their GitHub repositories by
  # tag — `component` names the repository, the module keeps its own name
  # (chicago/shell, chicago/tui-desktop) in the lock. A compatibility range,
  # never an exact version: the lock holds the exact one, and the range says
  # what the module was written against (v0.2.0 is the first tag of both).
  - version: ">=0.2.0"
    name: dep.chicago.shell
    kind: ns.dependency
    meta:
      comment: "The Chicago shell — its SDK lays out and draws the window (the tree, the table, the menu) and resolves the module's image pack."
    component: github.com/chicago-desktop/shell

  - version: ">=0.2.0"
    name: dep.chicago.tui_desktop
    kind: ns.dependency
    meta:
      comment: "The desktop base — the compositor that owns the window's frame, size and input, and asks the logged-on person's scope for chicago.admin."
    component: github.com/chicago-desktop/tui-desktop

  # chicago.regedit:images
  #
  # The shell finds an image pack in the registry by its meta.type and names a
  # picture `<entry>/<file>`: `chicago.regedit:images/regedit`. PNG in 32/
  # and 16/ under assets/images; packed only because wippy.yaml lists the
  # entry under `embed:`.
  - name: images
    kind: fs.directory
    meta:
      type: chicago.images
      comment: "The Registry Editor's pictures — the regedit icon at 32 and 16 px, an image pack of the shell."
    base: module
    directory: ./assets/images
    auto_init: false

  - name: model
    kind: library.lua
    meta:
      comment: "The registry tree from a list of entries, visible rows, entry fields and the path — a pure build with no calls to the registry."
    source: file://model.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry

  # Provider of the registry viewer: the same as a view, plus READING the
  # registry. `registry.apply` is not here and will not be (the shell's FR-004
  # §3.4): the viewer changes nothing, and editing an entry is the business of
  # the control panel under its own actor. The same actions as the shell's
  # `regedit_state` had when the window lived there.
  - name: window_scope
    kind: security.policy
    meta:
      comment: "Permissions of the registry viewer provider — context, sending to the compositor, and reading the registry; no writing to the registry, on purpose."
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - registry.get
        - registry.find
      resources: "*"
      effect: allow

  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Registry Editor
      # Shows every registry entry of the runtime: only for chicago.admin.
      requires: chicago.admin
      image: chicago.regedit:images/regedit
      icon: "▤"
      group: Settings
      order: 110
      window_type: app
      resizable: true
      width: 80
      height: 24
      pixel_render: chicago.shell.sdk:render
      pixel_state: chicago.regedit:window
      comment: "A registry viewer in the look of Windows 95 regedit — a tree of namespaces and entries, entry fields, the path; read-only; a window on the shell SDK."
    source: file://window.lua
    method: main
    modules:
      - json
      - registry
    security:
      policies: [chicago.regedit:window_scope]
    imports:
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
      model: chicago.regedit:model
