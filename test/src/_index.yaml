version: "1.0"
namespace: app

# Standalone harness for windows/regedit. Provides the host resources the boot
# needs (app:db, app:processes, a gateway and a router for the shell's
# endpoints, env storage, a permissive actor scope) and runs the co-located
# *_test.lua suites. Excluded from publish by the module's wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form —
# the other form is counted, printed green and never executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Registry Editor Test Harness}

  - name: model_test
    kind: function.lua
    meta:
      type: test
      comment: "The registry tree model — namespaces by dots, folders before entries, visible rows and the path, entry fields."
      group: Registry Editor
      suite: windows_regedit
    source: file://model_test.lua
    method: run
    imports:
      test: wippy.test:test
      reg_model: windows.regedit:model

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The window's registry entry (Settings, windows.admin, its own picture) and its read-only policy; the SDK tree's expander and keys, scrolling, the menu, the whole registry from an empty filter; test/shots/regedit.png."
      group: Registry Editor
      suite: windows_regedit
    source: file://window_test.lua
    method: run
    # The window's own modules (it is loaded here as an import), `gfx` and
    # `fs` for the picture and the shot, `tty` for the renderer.
    modules: [tty, gfx, fs, registry, json]
    imports:
      test: wippy.test:test
      ui: windows.shell.sdk:ui
      render: windows.shell.sdk:render
      rasters: windows.shell.theme:rasters
      images: windows.shell.theme:images
      reg_model: windows.regedit:model
      regedit_window: windows.regedit:window

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: "System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path."
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: "In-memory database — the module does not use it, but the shell's migrations ask for the resource."
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19246
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: regedit_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "windows/regedit"

  - name: regedit_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: regedit_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: regedit_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
