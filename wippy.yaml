organization: chicago
module: regedit
description: The Registry Editor for the Chicago desktop — a read-only viewer of the runtime's registry in the look of the mid-nineties regedit, for administrators.
license: MIT
repository: https://github.com/chicago-desktop/regedit
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - chicago
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# The image pack lives outside src/ and is packed only when named here
# (fs.directory -> fs.embed).
embed:
  - chicago.regedit:images
